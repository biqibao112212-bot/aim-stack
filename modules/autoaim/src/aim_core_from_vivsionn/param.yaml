%YAML:1.0
---
# %YAML:1.0
# ---

# debug画面开关 正式比赛要关掉，以提升自瞄帧率
DEBUG_SWITCH: 1
DEBUG_DRAW_DETECTOR_OVERLAY: 1
DEBUG_DRAW_SOLVED_ARMOR_OVERLAY: 0
DEBUG_DRAW_OBS_MATCH_LABELS: 1
DEBUG_DRAW_ESTIMATOR_OVERLAY: 1
DEBUG_DRAW_FIRECONTROL_OVERLAY: 1
DEBUG_LOG_MODE1_SELECTION_CSV: 0
DEBUG_LOG_FIRECONTROL_CSV: 0
DEBUG_ATTACK_ALL_ARMOR_COLORS: 0
RECORD_SWITCH: 0
# 第零步 检查相机清晰度，安装方式，设置曝光增益，需要肉眼能够看清装甲板与数字
# 倒置画面
CAMERA_UPSIDE_DOWN: 1
# 自瞄曝光时间 ms
AUTOSHOT_EXPOSURE_TIME: 4.76
# 自瞄曝光增益
AUTOSHOT_GAIN: 20

# 第一步 设置弹速 （问问电控预计弹速多少，或者从裁判系统读，不用很精确）
# 弹速
V: 22

# 第二步 贴脸关掉重力补偿 调H 这一步可以开着debug画面看看贴脸时装甲板是否完整
# 着弹点偏下调大 单位m 参考值0.08 每次调整0.01
H: 0.07
# 重力补偿开关 1=开 0=关
GRAVITY_OFFSET_SWITCH: 1

# 第二步 调cx、cy 打开重力补偿 拉到识别极限距离（约5m） 一定要打到正中心
# 如果着弹点散步大，拷打结构电控！包能调出来的，任何距离，任何高度差都能打
# 偏下调大 每次调整几十
AIMING_CY: -300
# 偏右调大 每次调整10
AIMING_CX: -160

# 第三步 调陀螺 关掉debug画面，用慢动作录像
# 旋转延时 
# 假设从右往左转 打点在中心偏右则调小
# 假设从左往右转 打点在中心偏左则调大
SPIN_DELAY_TIME: -20
SPIN_DELAY_TIME_SWITCH: 0

# 前哨站
OUTPOST_EXPOSURE_TIME: 2
OUTPOST_GAIN: 1

# 通信/执行延迟补偿
# 一般保持 0，不要用它补偿滞后，最高不要超过 0.001
HORIZONTAL_DELAY_TIME: 0
AIM_COMMAND_CTRL_MODE: 2

# 自动开火门限
FIRE_YAW_MISS_TOLERANCE_M: 0.055
FIRE_YAW_TOLERANCE_MIN_DEG: 0.9
FIRE_YAW_TOLERANCE_MAX_DEG: 1.5
FIRE_ARMOR_IMPACT_ENTER_ANGLE_DEG: 50.0
FIRE_ARMOR_IMPACT_LEAVE_ANGLE_DEG: 30.0
FIRE_COMMAND_STABLE_RATIO: 0.9
FIRE_RATE_HZ: 20.0
FIRE_FIRST_SHOT_ADVANCE_MS: -10.0
FIRE_SHOT_WINDOW_PRE_MS: 10.0
FIRE_SHOT_WINDOW_POST_MS: 0.0
FIRE_AUTO_ENTER_SLOT_COUNT: 2
FIRE_AUTO_HOLD_SLOT_COUNT: 1
FIRE_AUTO_MIN_BURST_MS: 20.0
FIRE_AUTO_RESTART_COOLDOWN_MS: 40.0
FIRE_BLOCK_ON_ARMORJUMP: 0
FIRE_ARMORJUMP_BLOCK_FRAMES: 4
CONTROL_LOOP_HZ: 250.0

# 选板评分窗口
PLANNER_ARMOR_ENTER_ANGLE_DEG: 55.0
PLANNER_ARMOR_LEAVE_ANGLE_DEG: 20.0

# CAN yaw MPC 标定默认值
SECOND_ORDER_CTRL_MODEL_DT_S: 0.004
SECOND_ORDER_CTRL_HORIZON: 50
SECOND_ORDER_CTRL_TRACK_Q: 3198
SECOND_ORDER_CTRL_RATE_Q: 0
SECOND_ORDER_CTRL_COMMAND_Q: 1000
SECOND_ORDER_CTRL_DELTA_R: 48343
SECOND_ORDER_CTRL_YAW_K: 0.99
SECOND_ORDER_CTRL_YAW_WN_RAD_S: 43.897
SECOND_ORDER_CTRL_YAW_ZETA: 0.4266
SECOND_ORDER_CTRL_YAW_DELAY_S: 0.0
SECOND_ORDER_CTRL_YAW_MAX_RATE_DEG_S: 720.0
SECOND_ORDER_CTRL_YAW_MAX_LEAD_DEG: 4
SECOND_ORDER_CTRL_YAW_MAX_STATE_RATE_DEG_S: 720.0
SECOND_ORDER_CTRL_OUTPUT_STAGE_RATIO: 0.0
SECOND_ORDER_CTRL_YAW_FEEDBACK_LPF_ALPHA: 0.87

# 自动开火开关
AUTO_SHOT_SWITCH: 1
# 0=只追踪同编号装甲板
IGNORE_SAMENUM_CONDITION_SWITCH: 0
ARMOR_NEUTRAL_GRACE_FRAMES: 100000

# get target
DRAW_TARGET_SWITCH: 1
LOST_THRESHOLD: 50
YPD_GEOMETRY_RECOVERY_WINDOW_FRAMES: 24
YPD_GEOMETRY_RECOVERY_COOLDOWN_FRAMES: 12
YPD_GEOMETRY_RECOVERY_MISMATCH_REQUIRED_STREAK: 2
YPD_GEOMETRY_RECOVERY_MIN_MATCHED_COUNT: 2
YPD_GEOMETRY_RECOVERY_Z_SIGMA_THRESHOLD: 3.0
YPD_GEOMETRY_RECOVERY_XY_SIGMA_THRESHOLD: 2.0
YPD_GEOMETRY_RECOVERY_COV_INFLATION_SCALE: 48.0
YPD_GEOMETRY_RECOVERY_MIN_DR_VARIANCE: 0.0025
YPD_GEOMETRY_RECOVERY_MIN_H_VARIANCE: 0.000625

# 标定
RADIAL_DISTORTION: !!opencv-matrix
   rows: 5
   cols: 1
   dt: d

   data: [-0.056031, 0.153727, -0.001629, 0.000165, 0]
CAMERA_MATRIX: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [1873.1327, 0, 523.0461, 0, 1874.1579, 562.0943, 0, 0, 1]
